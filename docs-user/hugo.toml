baseURL = 'https://braillekit.github.io/text-to-braille/'
languageCode = 'zh-tw'
title = 'EasyBrailleEdit 使用手冊'

contentDir = 'content'

[params]
  BookTheme = 'auto'
  BookSection = '*'
  BookRepo = 'https://github.com/braillekit/text-to-braille'
  BookDateFormat = '2006年1月2日'

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"
  [module.hugoVersion]
    extended = false
    min = "0.110.0"

[menu]
  [[menu.main]]
    name = "使用手冊"
    url = "/docs/"
    weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
